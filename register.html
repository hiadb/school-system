<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学校管理系统 - 注册</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .register-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #333; font-size: 28px; margin-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }
        .btn-register {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .role-selector { display: flex; gap: 10px; margin-bottom: 20px; }
        .role-option {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
        }
        .role-option.selected { border-color: #667eea; background: #f0f0ff; }
        .role-option input { display: none; }
        .role-icon { font-size: 32px; display: block; margin-bottom: 8px; }
        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        .login-link { text-align: center; margin-top: 20px; }
        .login-link a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <h1>📝 用户注册</h1>
        </div>
        
        <div id="errorMessage" class="error-message"></div>
        
        <form id="registerForm">
            <div class="form-group">
                <label>选择角色</label>
                <div class="role-selector">
                    <div class="role-option selected" onclick="selectRole('teacher')">
                        <input type="radio" name="role" value="teacher" checked>
                        <span class="role-icon">👨‍🏫</span>
                        <span>教师</span>
                    </div>
                    <div class="role-option" onclick="selectRole('student')">
                        <input type="radio" name="role" value="student">
                        <span class="role-icon">👨‍🎓</span>
                        <span>学生</span>
                    </div>
                    <div class="role-option" onclick="selectRole('parent')">
                        <input type="radio" name="role" value="parent">
                        <span class="role-icon">👨‍👩‍👦</span>
                        <span>家长</span>
                    </div>
                </div>
            </div>
            
            <!-- 邀请码输入框（学生和教师显示） -->
            <div class="form-group" id="inviteCodeGroup">
                <label for="inviteCode">邀请码 *</label>
                <input type="text" id="inviteCode" placeholder="请输入邀请码">
            </div>
            
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" required>
            </div>
            
            <div class="form-group">
                <label for="realName">真实姓名</label>
                <input type="text" id="realName" required>
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" required minlength="6">
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">确认密码</label>
                <input type="password" id="confirmPassword" required>
            </div>
            
            <button type="submit" class="btn-register">注 册</button>
        </form>
        
        <div class="login-link">
            已有账号？<a href="/login.html">立即登录</a>
        </div>
    </div>
    
    <script>
        const WORKER_URL = 'https://school-api.hru123.workers.dev';
        const API_BASE = WORKER_URL + '/api';
        
        function selectRole(role) {
            document.querySelector(`input[name="role"][value="${role}"]`).checked = true;
            document.querySelectorAll('.role-option').forEach(el => {
                el.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');
            
            // 学生和教师需要邀请码
            if (role === 'student' || role === 'teacher') {
                document.getElementById('inviteCodeGroup').style.display = 'block';
            } else {
                document.getElementById('inviteCodeGroup').style.display = 'none';
            }
        }
        
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => { errorEl.style.display = 'none'; }, 5000);
        }
        
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const role = document.querySelector('input[name="role"]:checked').value;
            const username = document.getElementById('username').value.trim();
            const realName = document.getElementById('realName').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const inviteCode = document.getElementById('inviteCode').value.trim();
            
            if (password !== confirmPassword) {
                showError('两次输入的密码不一致');
                return;
            }
            
            // 学生和教师必须输入邀请码
            if ((role === 'student' || role === 'teacher') && !inviteCode) {
                showError('请输入邀请码');
                return;
            }
            
            try {
                const response = await fetch(API_BASE + '/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, realName, role, inviteCode })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    alert('注册成功！请登录');
                    window.location.href = '/login.html';
                } else {
                    showError(data.error || '注册失败');
                }
            } catch (error) {
                showError('网络错误，请重试');
            }
        });
        
        // 默认显示邀请码（教师角色）
        document.getElementById('inviteCodeGroup').style.display = 'block';
    </script>
</body>
</html>
